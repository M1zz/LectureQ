name: LectureQ
options:
  bundleIdPrefix: com.lectureq
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    CODE_SIGN_STYLE: Automatic

packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    majorVersion: 3.16.1

targets:
  LectureQ:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LectureQ
    dependencies:
      - package: LeeoKit
    entitlements:
      path: LectureQ/LectureQ.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: LectureQ/Info.plist
      properties:
        # 수출 규정: 운영체제 암호화(HTTPS 등)만 쓴다 — 심사 때 암호화 질문을 건너뛴다
        ITSAppUsesNonExemptEncryption: false
        CFBundleName: 질문 노트
        CFBundleDisplayName: 질문 노트
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lectureq.LectureQ
        PRODUCT_NAME: LectureQ
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
