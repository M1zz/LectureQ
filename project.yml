name: LectureQ
options:
  bundleIdPrefix: com.lectureq
  # 앱 화면은 한국어 하나다. 개발 언어를 ko 로 두어야 날짜·시각도 한국어 형식으로 나온다
  # (en 이면 lproj 가 없는 이 앱은 영어로 떨어져 "October 9, 2026" · "10:00 AM" 으로 보인다).
  developmentLanguage: ko
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
    visionOS: "26.0"
  createIntermediateGroups: true

# 버전·빌드 번호의 단일 소스 — DeployBar 가 배포할 때 이 파일을 고친다.
# ⚠️ MARKETING_VERSION · CURRENT_PROJECT_VERSION 을 아래 settings 에 다시 넣지 말 것.
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    CODE_SIGN_STYLE: Automatic

packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    majorVersion: 3.44.1

targets:
  # Mac · iPhone · iPad · Vision Pro 한 타깃 — 번들 ID 와 앱 레코드가 하나라 한 번 사면 모든 기기에서 쓴다(유니버설 구매).
  # 공책은 사용자의 iCloud 개인 저장소(iCloud.com.lectureq.LectureQ)로 기기 사이를 오간다.
  LectureQ:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS, visionOS]
    sources:
      - path: LectureQ
        excludes: [AppIcon.icon]
      # 앱 아이콘 (Icon Composer). 묶음 하나로 넣어야 안의 SVG 가 낱개 리소스로 풀리지 않는다
      - path: LectureQ/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: LeeoKit
    scheme:
      testTargets:
        - LectureQTests
      # 로컬에서 구매 흐름을 굴려 보는 가짜 스토어 (→ LectureQ.storekit). Release · archive 에는 안 붙는다.
      # ⚠️ 상품 ID 는 App Store Connect 에 만들 상품과 글자 하나까지 같아야 한다 (→ LectureQSpec).
      storeKitConfiguration: LectureQ.storekit
    entitlements:
      path: LectureQ/LectureQ.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # 익명 사용 통계를 피드백 허브(CloudKit)로 보낸다 — 컨테이너 권한 없이 CKContainer 를 만들면 앱이 죽는다.
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.lectureq.LectureQ
          - iCloud.com.Ysoup.FeedbackHub
        com.apple.developer.icloud-services:
          - CloudKit
        # 다른 기기에서 고친 공책을 바로 받는 조용한 알림 (CloudKit 동기화)
        com.apple.developer.aps-environment: development
    info:
      path: LectureQ/Info.plist
      properties:
        # 수출 규정: 운영체제 암호화(HTTPS 등)만 쓴다 — 심사 때 암호화 질문을 건너뛴다
        ITSAppUsesNonExemptEncryption: false
        # 버전·빌드 번호는 Config/Version.xcconfig 에서 온다 — 여기 비워 두면 xcodegen 이 1.0 / 1 을 박는다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 기본값은 번들 파일 이름(LectureQ.app)과 같아야 Finder 가 언어별 이름(한국어 '질문 노트')을 쓴다 — 다르면 사용자가 바꾼 이름으로 여겨 파일 이름을 보인다
        CFBundleName: LectureQ
        CFBundleDisplayName: LectureQ
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.education
        # Finder · Spotlight 가 파일 이름(LectureQ.app) 대신 언어별 이름(InfoPlist.xcstrings, 한국어 '질문 노트')을 보이게 한다
        LSHasLocalizedDisplayName: true
        # iPhone · iPad
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lectureq.LectureQ
        PRODUCT_NAME: LectureQ
        TARGETED_DEVICE_FAMILY: "1,2,7"
        # iOS 는 샌드박스 키가 없는 자기 권한 파일을 쓴다 (Mac 샌드박스 키를 iOS 서명이 거절한다)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": LectureQ/LectureQ-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": LectureQ/LectureQ-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=xros*]": LectureQ/LectureQ-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=xrsimulator*]": LectureQ/LectureQ-iOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 앱 강조색 = 아이콘의 남색 노트 (시스템 Indigo)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # 핵심 순수 로직(마크다운 가져오기 해석 · 시점 계산 · 질문 블록 배치) 단위 테스트.
  # 앱을 호스트로 띄우되, 앱은 테스트 중엔 메모리 저장소만 쓴다(LectureQApp.isRunningUnitTests).
  LectureQTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LectureQTests
      # 가짜 스토어(→ LectureQ.storekit)로 상품 · 구매 흐름을 시험한다 (StoreKitTests). 앱 스킴의 실행도 같은 파일을 쓴다.
      - path: LectureQ.storekit
        buildPhase: resources
    dependencies:
      - target: LectureQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lectureq.LectureQTests
        GENERATE_INFOPLIST_FILE: YES
        # 앱 타깃이 Mac · iOS 겸용(platform: auto)이라 xcodegen 이 iOS 식 경로(LectureQ.app/LectureQ)를 잡는다.
        # 테스트는 Mac 에서 돌므로 Mac 앱의 실행 파일 경로를 직접 준다.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LectureQ.app/Contents/MacOS/LectureQ
        BUNDLE_LOADER: $(TEST_HOST)
