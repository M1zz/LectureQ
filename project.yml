name: LectureQ
options:
  bundleIdPrefix: com.lectureq
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

targets:
  LectureQ:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LectureQ
    info:
      path: LectureQ/Info.plist
      properties:
        CFBundleName: LectureQ
        CFBundleDisplayName: LectureQ
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lectureq.LectureQ
        PRODUCT_NAME: LectureQ
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
